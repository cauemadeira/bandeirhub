const SS_KEY = 'hub_k';
function b64b(s){ const x=atob(s),u=new Uint8Array(x.length); for(let i=0;i<x.length;i++) u[i]=x.charCodeAt(i); return u; }
function thisFile(){ const p=location.pathname.split('/').pop(); return (p && /\.html$/.test(p)) ? p : 'index.html'; }
function toLogin(){ location.replace('index.html?return=' + encodeURIComponent(thisFile())); }
(async()=>{
  let raw=null;
  try{ const b=sessionStorage.getItem(SS_KEY); if(b) raw=b64b(b); }catch(e){}
  if(!raw){ toLogin(); return; }
  try{
    const key=await crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64b(ENC.iv)}, key, b64b(ENC.data));
    const html=new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(e){
    try{ sessionStorage.removeItem(SS_KEY); }catch(_){}
    toLogin();
  }
})();
</script>
